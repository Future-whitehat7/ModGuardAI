[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions."threats-schedule"]
  schedule = "*/15 * * * *"

# Former pages described products that are not shipped. Send them home.
[[redirects]]
  from = "/pulse.json"
  to = "/.netlify/functions/threats"
  status = 200
  force = true

[[redirects]]
  from = "/features"
  to = "/"
  status = 301

[[redirects]]
  from = "/features/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/solutions"
  to = "/"
  status = 301

[[redirects]]
  from = "/solutions/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/demo"
  to = "/"
  status = 301

[[redirects]]
  from = "/pricing"
  to = "/"
  status = 301

[[redirects]]
  from = "/earlyaccess"
  to = "/"
  status = 301

[[redirects]]
  from = "/waitlist"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

[[redirects]]
